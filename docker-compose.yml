services:
  db:
    image: postgres:17-alpine
    container_name: accounting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: accounting
      POSTGRES_PASSWORD: accounting_dev
      POSTGRES_DB: accounting
    ports:
      - "5432:5432"
    volumes:
      - accounting_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accounting -d accounting"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  accounting_pgdata:
